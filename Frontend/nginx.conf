server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # I file statici mancanti devono dare 404
    location /assets/ {
        try_files $uri =404;
    }

    # Qualsiasi altra rotta viene gestita da React Router
    location / {
        try_files $uri /index.html;
    }
}
